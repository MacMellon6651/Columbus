services:
  postgres:
    image: postgres:16-alpine
    container_name: columbus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: columbus_user
      POSTGRES_PASSWORD: columbus_password
      POSTGRES_DB: columbus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U columbus_user -d columbus_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: columbus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://columbus_user:columbus_password@postgres:5432/columbus_db
      SECRET_KEY: "09d25e094faa256c818166b7a956b93f7099f6f0f4caa6cf63b88e8d3e7"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data: